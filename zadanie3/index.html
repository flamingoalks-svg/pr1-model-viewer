<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ПР3 — AR-маска «Собачка» на MindAR Face Tracking</title>

  <!-- A-Frame: декларативный фреймворк для 3D-сцен поверх three.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Трекинг лиц: модули MindAR Face Tracking (папка mindar/) + наш multi-face.js,
       который расширяет MindAR до нескольких лиц. Подключается ниже, в конце страницы. -->

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }

    /* Контейнер AR-сцены на весь экран. Сюда кладётся видео с камеры,
       а размер сцены подгоняется под пропорции видео. Сцена должна быть embedded:
       иначе A-Frame растягивает картинку под окно, и модели получаются сплюснутыми. */
    .ar-container { position: fixed; inset: 0; overflow: hidden; }

    /* Плашка поверх видео с камеры (как в задании 2) */
    .hud {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(24, 32, 42, 0.78);
      color: #F4F1EA;
      font: 600 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: #A15C00; }
    .hud[data-state="found"] .dot { background: #1E7F4E; }
    .hud[data-state="error"] .dot { background: #B3261E; }
    .hud span { flex: 1; }

    /* Переключатель заданий 1–4 (одинаковый на всех страницах) */
    .tasks {
      flex-basis: 100%;
      display: flex;
      align-items: center;
      gap: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(244, 241, 234, 0.15);
    }
    .tasks span { margin-right: 6px; opacity: 0.7; }
    .hud .tasks a {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #F4F1EA;
      text-decoration: none;
    }
    .hud .tasks a[aria-current="page"] { background: #C9A227; color: #18202A; }

    /* Подсказка внизу */
    .hint {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(24, 32, 42, 0.78);
      color: #F4F1EA;
      font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="hud" id="hud" data-state="wait">
    <div class="dot"></div>
    <span id="status">Запускаю камеру и нейросеть…</span>
    <nav class="tasks" aria-label="Переключение между заданиями">
      <span>Задания</span>
      <a href="../">1</a>
      <a href="../zadanie2/">2</a>
      <a href="../zadanie3/" aria-current="page">3</a>
      <a href="../zadanie4/">4</a>
    </nav>
  </div>

  <div class="hint">Открой рот — появится язык</div>

  <div class="ar-container" id="arContainer"></div>

  <!--
    СЦЕНА. Вставляется в arContainer скриптом multi-face.js после регистрации компонентов.
    multi-face: до 3 лиц одновременно; сглаживание фильтром One Euro, как в MindAR:
      filterMinCF — насколько сильно гасить дрожание, когда голова неподвижна;
      filterBeta  — насколько быстро фильтр догоняет быстрые движения головы.
  -->
  <template id="sceneTpl">
    <a-scene
      embedded
      multi-face="maxFaces: 3; filterMinCF: 0.0001; filterBeta: 1.5; template: #dogTpl"
      color-space="sRGB"
      renderer="colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-entity light="type: ambient; intensity: 0.9"></a-entity>
      <a-entity light="type: directional; intensity: 2" position="0.5 1 1"></a-entity>

      <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
    </a-scene>
  </template>

  <!--
    МАСКА «СОБАЧКА». Этот шаблон копируется на каждое найденное лицо.
    face-anchor="landmark: N" — привязка к ключевой точке лица N (как mindar-face-target).
    Система координат якоря (как в MindAR): 1 единица = ширина лица (~15 см),
    X — вправо, Y — вверх, Z — от лица к камере.
    Все детали собраны из примитивов: они симметричные и лёгкие, это даёт стабильный FPS.
  -->
  <template id="dogTpl">
    <!-- Невидимая «голова» за лицом: прячет нижнюю часть ушей. Точка 168 — переносица -->
    <a-entity face-anchor="landmark: 168">
      <a-sphere occluder radius="1" position="0 0.02 -0.5" scale="0.53 0.62 0.42"></a-sphere>
    </a-entity>

    <!--
      УШИ. Точка 10 — верх лба. Уши стоят по бокам над лбом и чуть позади (z = −0.2),
      наклонены наружу на 25° и слегка покачиваются. Основание уха уходит в «голову»
      и прячется окклюдером — кажется, что уши растут из головы.
    -->
    <a-entity face-anchor="landmark: 10">
      <a-entity position="-0.3 0.12 -0.2" rotation="0 0 25"
                animation="property: rotation; from: 0 0 21; to: 0 0 31; dir: alternate; loop: true; dur: 700; easing: easeInOutSine">
        <a-sphere radius="1" position="0 0.2 0" scale="0.13 0.25 0.045" material="color: #7A4A2A; roughness: 0.95"></a-sphere>
        <a-sphere radius="1" position="0 0.19 0.025" scale="0.08 0.17 0.03" material="color: #D9A07A; roughness: 0.95"></a-sphere>
      </a-entity>
      <a-entity position="0.3 0.12 -0.2" rotation="0 0 -25"
                animation="property: rotation; from: 0 0 -21; to: 0 0 -31; dir: alternate; loop: true; dur: 700; easing: easeInOutSine">
        <a-sphere radius="1" position="0 0.2 0" scale="0.13 0.25 0.045" material="color: #7A4A2A; roughness: 0.95"></a-sphere>
        <a-sphere radius="1" position="0 0.19 0.025" scale="0.08 0.17 0.03" material="color: #D9A07A; roughness: 0.95"></a-sphere>
      </a-entity>
    </a-entity>

    <!--
      НОС. Точка 1 — кончик носа. Тёмный блестящий эллипсоид немного выступает вперёд,
      задняя часть уходит внутрь носа и закрывается сеткой лица.
    -->
    <a-entity face-anchor="landmark: 1">
      <a-sphere radius="1" position="0 0 -0.01" scale="0.11 0.07 0.06"
                material="color: #2A1A14; roughness: 0.25; metalness: 0.1"></a-sphere>
      <a-sphere radius="1" position="-0.035 0.035 0.04" scale="0.025 0.012 0.01"
                material="color: #FFFFFF; emissive: #FFFFFF; emissiveIntensity: 0.6"></a-sphere>
    </a-entity>

    <!--
      ЯЗЫК. Точка 14 — внутренний край нижней губы. Язык свисает вниз перед подбородком.
      dog-tongue вытягивает его, когда нейросеть видит открытый рот (коэффициент мимики jawOpen),
      и покачивает из стороны в сторону.
    -->
    <a-entity face-anchor="landmark: 14">
      <a-entity dog-tongue>
        <a-sphere radius="1" position="0 -0.15 0.035" scale="0.12 0.18 0.03"
                  material="color: #E8697A; roughness: 0.5"></a-sphere>
        <a-box position="0 -0.13 0.066" width="0.008" height="0.17" depth="0.004"
               material="color: #B9475A"></a-box>
      </a-entity>
    </a-entity>
  </template>

  <script type="module">
    import './multi-face.js'; // компоненты регистрируются и вставляют сцену

    const hud = document.getElementById('hud');
    const statusEl = document.getElementById('status');
    const sceneEl = document.querySelector('a-scene');

    function setStatus(text, state) {
      statusEl.textContent = text;
      hud.dataset.state = state;
      console.log('[Face]', text);
    }

    sceneEl.addEventListener('arReady', () => setStatus('Камера готова. Покажи лицо в кадр.', 'wait'));
    sceneEl.addEventListener('arError', () => setStatus('Нет доступа к камере. Разреши его в настройках браузера.', 'error'));
    sceneEl.addEventListener('facescount', (e) => {
      const n = e.detail.count;
      if (n === 0) setStatus('Лиц не видно. Посмотри в камеру.', 'wait');
      else setStatus('Лиц в кадре: ' + n + ' из 3.', 'found');
    });
  </script>
</body>
</html>
